<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smarttrading Admin Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #090d16; color: #e2e8f0; padding: 16px; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 12px; margin-bottom: 20px; }
    h1 { font-size: 18px; color: #3b82f6; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
    .card { background: #131b2e; border: 1px solid #1e293b; border-radius: 8px; padding: 16px; }
    .group { display: flex; flex-direction: column; margin-bottom: 12px; }
    label { font-size: 12px; color: #94a3b8; margin-bottom: 4px; text-transform: uppercase; }
    input, select { background: #0b1120; border: 1px solid #334155; color: #fff; padding: 10px; border-radius: 6px; width: 100%; outline: none; }
    button { width: 100%; padding: 12px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-blue { background: #2563eb; color: #fff; }
    .btn-red { background: #dc2626; color: #fff; margin-top: 6px; }
  </style>
</head>
<body>

  <header>
    <h1>SMARTTRADING CONTROL CENTER</h1>
  </header>

  <div class="grid">
    <div class="card">
      <div class="group">
        <label>Even / Odd Payout (%)</label>
        <input type="number" id="evenOddPayout" value="95.2" step="0.1">
      </div>
      <div class="group">
        <label>Maintenance Mode</label>
        <select id="maintenanceMode">
          <option value="false">Active</option>
          <option value="true">Locked</option>
        </select>
      </div>
      <button class="btn-blue" onclick="updateGlobalConfig()">Save Config</button>
    </div>

    <div class="card">
      <div class="group">
        <label>Target User ID</label>
        <input type="text" id="targetUserId" placeholder="MongoDB User ID">
      </div>
      <div class="group">
        <label>Override Mode</label>
        <select id="forceOutcome">
          <option value="NORMAL">Normal Market</option>
          <option value="WIN">Force WIN</option>
          <option value="LOSS">Force LOSS</option>
        </select>
      </div>
      <div class="group">
        <label>Force Next Digit (0-9)</label>
        <input type="number" id="forcedNextDigit" min="0" max="9" placeholder="Random">
      </div>
      <button class="btn-red" onclick="applyUserOverride()">Apply Override</button>
    </div>
  </div>

  <script>
    const ADMIN_KEY = 'SECRET_ADMIN_KEY_123';
    const API_BASE = '/api/admin';

    async function apiRequest(endpoint, payload) {
      try {
        const res = await fetch(`${API_BASE}${endpoint}`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-admin-key': ADMIN_KEY
          },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.success) {
          alert('Success!');
        } else {
          alert('Error: ' + (data.error || data.message));
        }
      } catch (err) {
        alert('Server Connection Failed: ' + err.message);
      }
    }

    function updateGlobalConfig() {
      const evenOddPayout = parseFloat(document.getElementById('evenOddPayout').value);
      const maintenanceMode = document.getElementById('maintenanceMode').value === 'true';
      apiRequest('/global-config', { evenOddPayout, maintenanceMode });
    }

    function applyUserOverride() {
      const userId = document.getElementById('targetUserId').value;
      const forceOutcome = document.getElementById('forceOutcome').value;
      const forcedNextDigit = document.getElementById('forcedNextDigit').value;
      if (!userId) return alert('Enter User ID');
      apiRequest('/manipulate-user', { userId, forceOutcome, forcedNextDigit });
    }
  </script>
</body>
</html>
