<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smarttrading Platform</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-dark: #12161c;
            --card-bg: #1e2329;
            --accent-green: #0ecb81;
            --accent-red: #f6465d;
            --accent-blue: #2b6cb0;
            --text-main: #eaecef;
            --text-muted: #848e9c;
            --border-color: #2b313a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--card-bg);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .logo {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--accent-green);
        }

        .user-controls {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .balance-badge {
            background: #2b313a;
            padding: 0.5rem 0.8rem;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .btn {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover { opacity: 0.85; }
        .btn-green { background: var(--accent-green); color: #000; }
        .btn-red { background: var(--accent-red); color: #fff; }
        .btn-blue { background: var(--accent-blue); color: #fff; }

        .main-layout {
            display: grid;
            grid-template-columns: 280px 1fr 340px;
            height: calc(100vh - 65px);
            overflow: hidden;
        }

        /* Sidebar Markets List */
        .sidebar {
            background: var(--card-bg);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .sidebar-title {
            padding: 1rem;
            font-size: 0.9rem;
            text-transform: uppercase;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
        }

        .markets-scroll {
            overflow-y: auto;
            flex-grow: 1;
        }

        .market-item {
            padding: 0.8rem 1rem;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
        }

        .market-item:hover, .market-item.active {
            background: #2b313a;
        }

        /* Center Chart View */
        .center-pane {
            display: flex;
            flex-direction: column;
            padding: 1rem;
            gap: 1rem;
            overflow-y: auto;
        }

        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chart-container {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 1rem;
            height: 380px;
            position: relative;
        }

        /* Control Panel Right */
        .trading-panel {
            background: var(--card-bg);
            border-left: 1px solid var(--border-color);
            padding: 1rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .mode-toggle {
            display: grid;
            grid-template-columns: 1fr 1fr;
            background: #12161c;
            padding: 0.2rem;
            border-radius: 4px;
        }

        .mode-btn {
            padding: 0.5rem;
            text-align: center;
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            border-radius: 4px;
        }

        .mode-btn.active {
            background: var(--accent-blue);
            color: #fff;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .input-group label {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .input-group input, .input-group select {
            padding: 0.6rem;
            background: #12161c;
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 4px;
        }

        .action-btns {
            display: flex;
            gap: 0.5rem;
        }

        .action-btns .btn {
            flex: 1;
            padding: 0.8rem;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg);
            width: 400px;
            padding: 1.5rem;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            border: 1px solid var(--border-color);
        }

        .modal-content h3 { border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; }

        .tab-group { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; }
        .tab-btn { flex: 1; padding: 0.5rem; background: #12161c; color: #fff; border: none; cursor: pointer; }
        .tab-btn.active { background: var(--accent-blue); }

        .deposit-option { display: none; flex-direction: column; gap: 0.8rem; }
        .deposit-option.active { display: flex; }

        .wallet-box {
            background: #12161c;
            padding: 0.6rem;
            font-size: 0.75rem;
            word-break: break-all;
            border: 1px dashed var(--border-color);
            border-radius: 4px;
        }

        .admin-panel {
            margin-top: auto;
            background: #12161c;
            padding: 0.8rem;
            border-radius: 4px;
            border: 1px solid var(--accent-red);
        }

        .admin-panel h4 { font-size: 0.8rem; color: var(--accent-red); margin-bottom: 0.5rem; }
    </style>
</head>
<body>

    <header>
        <div class="logo">Smarttrading</div>
        <div class="user-controls">
            <div class="balance-badge">Balance: $<span id="user-balance">1000.00</span></div>
            <button class="btn btn-blue" onclick="openModal('deposit-modal')">Deposit</button>
            <button class="btn btn-green" id="auth-btn" onclick="openModal('auth-modal')">Login / Register</button>
        </div>
    </header>

    <div class="main-layout">
        <!-- 20+ Active Markets Panel -->
        <div class="sidebar">
            <div class="sidebar-title">Markets (20+)</div>
            <div class="markets-scroll" id="markets-list"></div>
        </div>

        <!-- Center Interactive Chart -->
        <div class="center-pane">
            <div class="chart-header">
                <h2 id="current-market-title">BTC/USDT</h2>
                <span id="market-price" style="font-size: 1.2rem; font-weight: bold; color: var(--accent-green);">$0.00</span>
            </div>
            <div class="chart-container">
                <canvas id="tradingChart"></canvas>
            </div>
        </div>

        <!-- Trading Control & Scrollable Buttons Panel -->
        <div class="trading-panel">
            <h3>Trade Options</h3>

            <div class="mode-toggle">
                <button class="mode-btn active" id="btn-mode-standard" onclick="setTradeType('standard')">Rise / Fall</button>
                <button class="mode-btn" id="btn-mode-digit" onclick="setTradeType('digit')">Even / Odd</button>
            </div>

            <div class="input-group">
                <label>Stake Amount ($)</label>
                <input type="number" id="stake-amount" value="10" min="1">
            </div>

            <!-- Standard Options -->
            <div id="standard-controls" class="action-btns">
                <button class="btn btn-green" onclick="executeTrade('BUY / RISE')">BUY / RISE</button>
                <button class="btn btn-red" onclick="executeTrade('SELL / FALL')">SELL / FALL</button>
            </div>

            <!-- Even / Odd Activated Option Lines -->
            <div id="digit-controls" class="action-btns" style="display: none;">
                <button class="btn btn-blue" onclick="executeTrade('EVEN')">EVEN</button>
                <button class="btn btn-red" onclick="executeTrade('ODD')">ODD</button>
            </div>

            <!-- Admin Section Panel for Approvals -->
            <div class="admin-panel">
                <h4>Admin Control Panel</h4>
                <div id="pending-requests" style="font-size: 0.8rem; color: var(--text-muted);">No pending manual approvals.</div>
            </div>
        </div>
    </div>

    <!-- Auth Modal (Login / Signup) -->
    <div class="modal" id="auth-modal">
        <div class="modal-content">
            <h3>Account Access</h3>
            <div class="tab-group">
                <button class="tab-btn active" onclick="toggleAuthTab('login')">Login</button>
                <button class="tab-btn" onclick="toggleAuthTab('signup')">Sign Up</button>
            </div>
            <form id="auth-form" onsubmit="handleAuth(event)">
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" required placeholder="user@example.com">
                </div>
                <div class="input-group" style="margin-top: 0.5rem;">
                    <label>Password</label>
                    <input type="password" required placeholder="******">
                </div>
                <button type="submit" class="btn btn-green" style="margin-top: 1rem; width: 100%;" id="auth-submit-btn">Login</button>
            </form>
            <button class="btn" style="background: transparent; color: var(--text-muted);" onclick="closeModal('auth-modal')">Cancel</button>
        </div>
    </div>

    <!-- Deposit Modal (BEP-20 & M-Pesa Integration) -->
    <div class="modal" id="deposit-modal">
        <div class="modal-content">
            <h3>Deposit Funds</h3>
            <div class="tab-group">
                <button class="tab-btn active" onclick="toggleDepositTab('bep20')">BEP-20 (Crypto)</button>
                <button class="tab-btn" onclick="toggleDepositTab('mpesa')">M-Pesa</button>
            </div>

            <!-- BEP-20 View -->
            <div class="deposit-option active" id="bep20-view">
                <p style="font-size: 0.85rem; color: var(--text-muted);">Send USDT / BNB over BEP-20 network to the address below:</p>
                <div class="wallet-box" id="bep20-address">0xcf8d2ad2f246055ac262a87b625418b12bf4b9f7</div>
                <button class="btn btn-blue" onclick="copyAddress()">Copy Address</button>
            </div>

            <!-- M-Pesa View -->
            <div class="deposit-option" id="mpesa-view">
                <div class="input-group">
                    <label>M-Pesa Phone Number</label>
                    <input type="tel" id="mpesa-phone" placeholder="e.g. 254712345678">
                </div>
                <div class="input-group">
                    <label>Amount ($)</label>
                    <input type="number" id="mpesa-amount" placeholder="Amount in USD">
                </div>
                <button class="btn btn-green" onclick="processMpesa()">Send Request</button>
                <div id="mpesa-status" style="font-size: 0.85rem; text-align: center; font-weight: bold;"></div>
            </div>

            <button class="btn" style="background: transparent; color: var(--text-muted);" onclick="closeModal('deposit-modal')">Close</button>
        </div>
    </div>

    <script>
        // --- 20+ Market Data Set ---
        const markets = [
            { id: 'BTCUSDT', name: 'Bitcoin (BTC/USDT)', price: 65420.50 },
            { id: 'ETHUSDT', name: 'Ethereum (ETH/USDT)', price: 3480.10 },
            { id: 'SOLUSDT', name: 'Solana (SOL/USDT)', price: 145.20 },
            { id: 'BNBUSDT', name: 'Binance Coin (BNB)', price: 580.75 },
            { id: 'XRPUSDT', name: 'Ripple (XRP/USDT)', price: 0.52 },
            { id: 'ADAUSDT', name: 'Cardano (ADA/USDT)', price: 0.38 },
            { id: 'AVAXUSDT', name: 'Avalanche (AVAX)', price: 28.40 },
            { id: 'DOGEUSDT', name: 'Dogecoin (DOGE)', price: 0.12 },
            { id: 'DOTUSDT', name: 'Polkadot (DOT)', price: 6.15 },
            { id: 'LINKUSDT', name: 'Chainlink (LINK)', price: 13.80 },
            { id: 'EURUSD', name: 'Forex: EUR/USD', price: 1.0850 },
            { id: 'GBPUSD', name: 'Forex: GBP/USD', price: 1.2910 },
            { id: 'USDJPY', name: 'Forex: USD/JPY', price: 153.40 },
            { id: 'AUDUSD', name: 'Forex: AUD/USD', price: 0.6540 },
            { id: 'GOLD', name: 'Commodity: Gold', price: 2380.50 },
            { id: 'OIL', name: 'Commodity: Crude Oil', price: 78.20 },
            { id: 'VOL10', name: 'Volatility 10 Index', price: 10425.30 },
            { id: 'VOL25', name: 'Volatility 25 Index', price: 25110.80 },
            { id: 'VOL50', name: 'Volatility 50 Index', price: 50890.10 },
            { id: 'VOL75', name: 'Volatility 75 Index', price: 75310.40 },
            { id: 'VOL100', name: 'Volatility 100 Index', price: 100420.90 }
        ];

        let selectedMarket = markets[0];
        let currentTradeType = 'standard';
        let chart;
        let pendingApprovals = [];
        let userBalance = 1000.00;
        let currentAuthMode = 'login';

        // --- Initialize Markets List ---
        function initMarkets() {
            const container = document.getElementById('markets-list');
            container.innerHTML = '';
            markets.forEach(m => {
                const el = document.createElement('div');
                el.className = `market-item ${m.id === selectedMarket.id ? 'active' : ''}`;
                el.onclick = () => selectMarket(m);
                el.innerHTML = `
                    <span>${m.name}</span>
                    <span id="price-${m.id}" style="color: var(--accent-green); font-weight: bold;">$${m.price.toFixed(2)}</span>
                `;
                container.appendChild(el);
            });
        }

        function selectMarket(market) {
            selectedMarket = market;
            document.getElementById('current-market-title').innerText = market.name;
            document.getElementById('market-price').innerText = `$${market.price.toFixed(2)}`;
            initMarkets();
            resetChartData();
        }

        // --- Setup Chart.js Graphs ---
        function initChart() {
            const ctx = document.getElementById('tradingChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: Array(15).fill(''),
                    datasets: [{
                        label: 'Price Feed',
                        data: generateInitialPrices(selectedMarket.price),
                        borderColor: '#0ecb81',
                        borderWidth: 2,
                        fill: false,
                        tension: 0.2
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { display: false },
                        y: { grid: { color: '#2b313a' }, ticks: { color: '#848e9c' } }
                    },
                    plugins: { legend: { display: false } }
                }
            });

            // Live updates simulated ticks
            setInterval(() => {
                if (!chart) return;
                const lastPrice = chart.data.datasets[0].data.slice(-1)[0];
                const variance = (Math.random() - 0.49) * (lastPrice * 0.002);
                const newPrice = lastPrice + variance;
                
                chart.data.datasets[0].data.shift();
                chart.data.datasets[0].data.push(newPrice);
                chart.data.datasets[0].borderColor = newPrice >= lastPrice ? '#0ecb81' : '#f6465d';
                chart.update();

                document.getElementById('market-price').innerText = `$${newPrice.toFixed(2)}`;
                const sidePriceEl = document.getElementById(`price-${selectedMarket.id}`);
                if (sidePriceEl) sidePriceEl.innerText = `$${newPrice.toFixed(2)}`;
            }, 1000);
        }

        function generateInitialPrices(base) {
            let pts = [base];
            for(let i=0; i<14; i++) {
                pts.unshift(pts[0] + (Math.random() - 0.5) * (base * 0.002));
            }
            return pts;
        }

        function resetChartData() {
            if(!chart) return;
            chart.data.datasets[0].data = generateInitialPrices(selectedMarket.price);
            chart.update();
        }

        // --- Controls Activation (Even/Odd vs Standard Lines) ---
        function setTradeType(type) {
            currentTradeType = type;
            document.getElementById('btn-mode-standard').classList.toggle('active', type === 'standard');
            document.getElementById('btn-mode-digit').classList.toggle('active', type === 'digit');
            
            document.getElementById('standard-controls').style.display = type === 'standard' ? 'flex' : 'none';
            document.getElementById('digit-controls').style.display = type === 'digit' ? 'flex' : 'none';
        }

        function executeTrade(optionName) {
            const stake = parseFloat(document.getElementById('stake-amount').value);
            if (stake > userBalance) {
                alert("Insufficient Balance!");
                return;
            }
            userBalance -= stake;
            updateBalanceUI();
            alert(`Trade placed: ${optionName} on ${selectedMarket.name} with stake $${stake}`);
        }

        // --- Auth Switching ---
        function toggleAuthTab(mode) {
            currentAuthMode = mode;
            const tabs = document.querySelectorAll('#auth-modal .tab-btn');
            tabs[0].classList.toggle('active', mode === 'login');
            tabs[1].classList.toggle('active', mode === 'signup');
            document.getElementById('auth-submit-btn').innerText = mode === 'login' ? 'Login' : 'Create Account';
        }

        function handleAuth(e) {
            e.preventDefault();
            document.getElementById('auth-btn').innerText = "Account Active";
            closeModal('auth-modal');
            alert(currentAuthMode === 'login' ? 'Successfully Logged In!' : 'Account Created Successfully!');
        }

        // --- Deposit Management & Admin Panel Flow ---
        function toggleDepositTab(tab) {
            const tabs = document.querySelectorAll('#deposit-modal .tab-btn');
            tabs[0].classList.toggle('active', tab === 'bep20');
            tabs[1].classList.toggle('active', tab === 'mpesa');
            
            document.getElementById('bep20-view').classList.toggle('active', tab === 'bep20');
            document.getElementById('mpesa-view').classList.toggle('active', tab === 'mpesa');
        }

        function copyAddress() {
            const addr = document.getElementById('bep20-address').innerText;
            navigator.clipboard.writeText(addr);
            alert("BEP-20 Address Copied!");
        }

        function processMpesa() {
            const phone = document.getElementById('mpesa-phone').value;
            const amount = parseFloat(document.getElementById('mpesa-amount').value);
            const statusEl = document.getElementById('mpesa-status');

            if (!phone || !amount || amount <= 0) {
                alert("Enter a valid phone number and deposit amount.");
                return;
            }

            statusEl.style.color = "var(--accent-green)";
            statusEl.innerText = "STK prompt sent. Please authorize payment on your mobile phone.";

            // Add payment to admin manual approval queue
            const requestId = Date.now();
            pendingApprovals.push({ id: requestId, phone, amount });
            renderAdminPanel();

            setTimeout(() => {
                closeModal('deposit-modal');
                statusEl.innerText = "";
            }, 2500);
        }

        function renderAdminPanel() {
            const panel = document.getElementById('pending-requests');
            if (pendingApprovals.length === 0) {
                panel.innerHTML = "No pending manual approvals.";
                return;
            }

            panel.innerHTML = pendingApprovals.map(req => `
                <div style="display:flex; justify-space-between; align-items:center; margin-top: 0.4rem; background: #1e2329; padding: 0.4rem; border-radius: 4px;">
                    <div>
                        <div><b>$${req.amount}</b> (${req.phone})</div>
                    </div>
                    <button class="btn btn-green" style="padding: 0.2rem 0.5rem; font-size: 0.75rem;" onclick="approveDeposit(${req.id})">Approve</button>
                </div>
            `).join('');
        }

        function approveDeposit(requestId) {
            const index = pendingApprovals.findIndex(r => r.id === requestId);
            if (index !== -1) {
                const req = pendingApprovals[index];
                userBalance += req.amount;
                updateBalanceUI();
                pendingApprovals.splice(index, 1);
                renderAdminPanel();
                alert(`Approved $${req.amount} deposit manually!`);
            }
        }

        function updateBalanceUI() {
            document.getElementById('user-balance').innerText = userBalance.toFixed(2);
        }

        // --- Utility Modal Helpers ---
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }

        // Start Platform Initialization
        window.onload = () => {
            initMarkets();
            initChart();
        };
    </script>
</body>
</html>
